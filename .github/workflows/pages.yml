name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Check public content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && ! echo "$BASE_SHA" | grep -Eq '^0+$'; then
            node scripts/check-publication.mjs --range "$BASE_SHA..$HEAD_SHA"
          else
            node scripts/check-publication.mjs --range "$HEAD_SHA"
          fi
      - run: npm run test:publication
      - run: npm ci
      - run: npm run test:catalogue
      - run: npm run check:assets
      - run: npm run check:templates
      - run: npm run check:demos
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:headless
      - name: Build demo
        env:
          QUEUELAB_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          npm run build
          node --input-type=module -e "import fs from 'node:fs'; const pkg=JSON.parse(fs.readFileSync('package.json')); fs.writeFileSync('dist/build-info.json', JSON.stringify({source:process.env.GITHUB_SHA,version:pkg.version})+'\n');"
      - name: Upload static application
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
