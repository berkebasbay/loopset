name: Verify changes

# Check every PR revision, including drafts; keep manual dispatch available.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopset-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Official release refs resolved through api.github.com on 2026-10-20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record tested revision
        env:
          QUEUELAB_EVENT: ${{ github.event_name }}
          QUEUELAB_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'event=%s\n' "$QUEUELAB_EVENT"
          printf 'pr_head=%s\n' "$QUEUELAB_PR_HEAD"
          git log -1 --format='checkout=%H'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && ! echo "$BASE_SHA" | grep -Eq '^0+$'; then
            node scripts/check-publication.mjs --range "$BASE_SHA..$HEAD_SHA"
          else
            node scripts/check-publication.mjs --range "$HEAD_SHA"
          fi
      - run: npm run test:publication
      - run: npm ci
      - run: npm run test:catalogue
      - run: npm run check:assets
      - run: npm run check:templates
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:engine
      - run: node scripts/simulate.mjs --example factory --seed 4207
      - run: node scripts/simulate.mjs examples/service.json --seed 4207
      - run: node examples/verify.mjs
